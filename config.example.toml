[api]
provider = "groq"
api_key = "" # Prefer GROQ_API_KEY in the environment.
api_keys = [] # Up to 3 keys; requests try them in order when a key fails.
model = "openai/gpt-oss-20b"
stream = true
max_tokens = 1024

[context]
# Add interview-specific reference documents. Paths may be absolute or relative
# to this config file. These files are loaded locally and sent as AI context.
files = [
  "~/Documents/interview/resume.md",
  "~/Documents/interview/job-description.md",
]
max_chars = 24000

[audio]
enabled = true
# Empty means the current default PipeWire output (Meet/system audio).
source = ""
chunk_seconds = 4
# Minimum speech duration before endpoint silence can close an utterance.
min_utterance_seconds = 2
# Hard safety limit for one complete spoken request.
max_utterance_seconds = 10
transcription_model = "whisper-large-v3-turbo"
# Keep two requests in flight so transcription overlaps recording.
max_concurrent_transcriptions = 2
language = "en"
# Skip transcription results below this confidence (0 disables filtering).
confidence_threshold = 0.0
# Stop a speech segment after this much trailing silence.
endpoint_silence_ms = 500

[screen]
vision_model = "qwen/qwen3.8-27b"
answer_target = "webpage"

# Window sizes are GTK logical pixels. The compositor may scale them to
# physical display pixels according to the monitor's scale setting.
[screen.overlay_window]
min_width = 320
width = 643
max_width = 1200
min_height = 120
height = 189
max_height = 378
# Settings > Floating saves custom coordinates here when you move the sample.
# Leave both unset to center the answer window when it opens.
# position_x = 100
# position_y = 100
