name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build x86_64 Linux release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev pkg-config

      - name: Build release binary
        run: cargo +stable build --release --locked

      - name: Package release archive and checksum
        shell: bash
        run: |
          archive="hyprly-${GITHUB_REF_NAME}-x86_64-linux.tar.gz"
          tar -czf "$archive" \
            -C target/release hyprly \
            -C "$GITHUB_WORKSPACE" README.md LICENSE config.example.toml
          sha256sum "$archive" > checksums.txt

      - name: Attach files to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            hyprly-*.tar.gz
            checksums.txt
