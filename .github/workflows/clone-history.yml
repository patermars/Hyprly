name: Update repository statistics

on:
  schedule:
    - cron: "17 4 * * 1" # Every Monday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clone-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update monthly activity history, chart, and README badge and link
        run: python3 src/render_activity_chart.py

      - name: Update clone history
        uses: MacRimi/repo-growth@aa67f0c60a4d2c83750b36ebaeb29198a010161b # v1
        with:
          metrics: clones
          layout: separate
          output: assets/repo-growth.svg
          traffic-token: ${{ secrets.REPO_GROWTH_TRAFFIC_TOKEN }}
          commit: false

      # Clone chart is not displayed in the README.
      # - name: Render plot-only clone chart
      #   run: python3 src/render_clone_chart.py

      - name: Commit updated repository statistics
        run: |
          git config user.name "PaterMars"
          git config user.email "patermars@outlook.com"
          git add .github/repo-growth/history.json .github/activity/history.json assets/count.svg README.md
          # git add assets/repo-growth-clones.svg
          if git diff --cached --quiet; then
            echo "Repository statistics are already up to date."
          else
            git commit -m "Updated repo stats"
            git push
          fi
