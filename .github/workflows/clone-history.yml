name: Update clone history

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clone-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update clone history chart
        uses: MacRimi/repo-growth@v1
        with:
          metrics: clones
          layout: separate
          output: assets/repo-growth.svg
          traffic-token: ${{ secrets.REPO_GROWTH_TRAFFIC_TOKEN }}
          commit: false

      - name: Render plot-only clone chart
        run: python3 src/render_clone_chart.py

      - name: Commit updated clone history
        run: |
          git config user.name "PaterMars"
          git config user.email "patermars@outlook.com"
          git add .github/repo-growth/history.json assets/repo-growth-clones.svg
          if git diff --cached --quiet; then
            echo "Clone history is already up to date."
          else
            git commit -m "Updated repo stats"
            git push
          fi
