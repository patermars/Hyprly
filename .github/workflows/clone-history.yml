name: Update clone history

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clone-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update clone history chart
        uses: MacRimi/repo-growth@v1
        with:
          title: Hyprly clone history
          metrics: clones
          layout: separate
          output: assets/repo-growth.svg
          traffic-token: ${{ secrets.REPO_GROWTH_TRAFFIC_TOKEN }}
