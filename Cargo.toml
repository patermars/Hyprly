[package]
name = "hyprly"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AI overlay for Hyprland"

[[bin]]
name = "hyprly"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = "0.7"
gtk4-layer-shell = "0.4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures-util = "0.3"
dirs = "5"
