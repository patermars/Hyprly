[package]
name = "hyprly"
version = "3.1.2"
edition = "2021"
license = "MIT"
description = "GTK4 AI meeting assistant with a mobile client"

[[bin]]
name = "hyprly"
path = "src/main.rs"

[dependencies]
tokio = {
    version = "1.54.1",
    features = [
        "fs",
        "io-std",
        "io-util",
        "macros",
        "net",
        "process",
        "rt-multi-thread",
        "signal",
        "sync",
        "time",
    ],
}
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
hound = "3"
tokio-util = "0.7"
qrcode = { version = "0.14", default-features = false }
rcgen = "0.14"
gtk4 = { version = "0.9", features = ["v4_6"] }
ksni = "0.3"
toml_edit = { version = "0.25", features = ["serde"] }
libc = "0.2"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
