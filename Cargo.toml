[package]
name = "hyprly"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "GTK4 AI meeting assistant with a mobile client"

[[bin]]
name = "hyprly"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures-util = "0.3"
dirs = "5"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
hound = "3"
tokio-util = "0.7"
regex = "1"
qrcode = { version = "0.14", default-features = false }
rcgen = "0.14"
sha2 = "0.10"
gtk4 = "0.9"
ksni = "0.3"
toml_edit = "0.22"
png = "0.17"
