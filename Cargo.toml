[package]
name = "hyprly"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Headless AI meeting assistant with a mobile client"

[[bin]]
name = "hyprly"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures-util = "0.3"
dirs = "5"
axum = { version = "0.8", features = ["ws"] }
hound = "3"
tokio-util = "0.7"
regex = "1"
